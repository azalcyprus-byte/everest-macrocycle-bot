name: Zhukov monitoring tests
on:
  pull_request:
    paths:
      - "zhukov_monitor.py"
      - "bot.py"
      - "tests/test_zhukov_monitor.py"
      - ".github/workflows/zhukov-monitor-tests.yml"
  push:
    branches:
      - feature/zhukov-state-monitoring
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q bot.py zhukov_monitor.py tests/test_zhukov_monitor.py
      - run: python -m unittest discover -s tests -p "test_zhukov_monitor.py" -v
