name: Zhukov monitoring tests
on:
  pull_request:
    paths:
      - "zhukov_monitor.py"
      - "zhukov_ai.py"
      - "everest_curator_chat.py"
      - "tests/test_everest_curator_chat.py"
      - "zhukov_brief.py"
      - "zhukov_plan.py"
      - "tests/test_zhukov_plan.py"
      - "tests/test_zhukov_brief.py"
      - "bot.py"
      - "tests/test_zhukov_monitor.py"
      - "tests/test_zhukov_apps_script.js"
      - "apps_script/ZhukovEvents.gs"
      - ".github/workflows/zhukov-monitor-tests.yml"
  push:
    branches:
      - feature/zhukov-state-monitoring
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q bot.py zhukov_monitor.py zhukov_ai.py zhukov_brief.py tests/test_zhukov_monitor.py tests/test_zhukov_brief.py zhukov_plan.py tests/test_zhukov_plan.py everest_curator_chat.py tests/test_everest_curator_chat.py
      - run: python -m unittest discover -s tests -p "test_zhukov_*.py" -v
      - run: python -m unittest discover -s tests -p "test_everest_curator_chat.py" -v
      - run: cp apps_script/ZhukovEvents.gs /tmp/ZhukovEvents.js && node --check /tmp/ZhukovEvents.js
      - run: node tests/test_zhukov_apps_script.js
